<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>QUOTEX LIVE.PRO</title>
<style>
:root {
  --bg: #050b16;
  --cyan: #08a8c4;
  --green: #00a878;
  --text: #f4f7fb;
  --muted: #98a4b5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  color: var(--text);
  font-family: system-ui, sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(0,166,198,.16), transparent 32%),
    radial-gradient(circle at 90% 90%, rgba(0,168,120,.13), transparent 35%),
    var(--bg);
}
.card {
  width: min(100%, 720px);
  padding: clamp(28px,7vw,64px) clamp(20px,6vw,48px);
  text-align: center;
  border: 1px solid rgba(13,190,209,.7);
  border-radius: 28px;
  background: rgba(7,16,29,.94);
  box-shadow: 0 0 38px rgba(0,175,200,.12), 0 24px 70px rgba(0,0,0,.35);
}
.eyebrow {
  margin: 0 0 14px;
  color: var(--green);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  color: var(--cyan);
  font-size: clamp(2rem,7vw,3.1rem);
  line-height: 1.12;
}
.subtitle {
  margin: 24px 0 8px;
  color: var(--muted);
  font-size: clamp(1rem,3.5vw,1.25rem);
}
.description {
  margin: 0 auto 32px;
  max-width: 460px;
  color: #c2cad5;
  line-height: 1.7;
}
.button {
  display: flex;
  width: 100%;
  min-height: 58px;
  align-items: center;
  justify-content: center;
  padding: 16px 22px;
  border: none;
  border-radius: 14px;
  color: #03131d;
  font-size: 1.05rem;
  font-weight: 850;
  background: linear-gradient(100deg,#078aa8,#00a878);
  cursor: pointer;
}
.maintenance {
  margin-top: 28px;
  padding: 22px 12px;
  border: 1px solid rgba(13,190,209,.35);
  border-radius: 16px;
  background: rgba(8,168,196,.07);
}
.maintenance h2 {
  margin: 0 0 14px;
  color: var(--cyan);
  font-size: clamp(1.25rem,5vw,1.8rem);
}
.maintenance p {
  margin: 0;
  color: var(--text);
  line-height: 1.7;
}
footer {
  margin-top: 26px;
  color: #536174;
  font-size: .75rem;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Welcome</p>
  <h1>QUOTEX LIVE.PRO</h1>

  <section id="welcome">
    <p class="subtitle">Welcome to our website</p>
    <p class="description">Explore our service page. Tap the button below to continue to the website.</p>
    <button class="button" id="openService" type="button">OPEN SERVICE</button>
  </section>

  <section class="maintenance" id="maintenance" role="status" hidden>
    <h2>🛠️ SERVER MAINTENANCE</h2>
    <p>⚠️ সার্ভারে বর্তমানে মেইনটেন্যান্সের কাজ চলছে।</p>
  </section>

  <footer>QUOTEX LIVE.PRO</footer>
</main>

<script>
document.getElementById("openService").addEventListener("click", function () {
  document.getElementById("welcome").hidden = true;
  document.getElementById("maintenance").hidden = false;
});
</script>
</body>
</html>
